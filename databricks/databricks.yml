# Databricks Asset Bundle (DAB) — optional convenience.
#
# This bundle lets you deploy the medallion notebooks to a workspace and (if you
# want) run them as a job, instead of importing them by hand. It is OPTIONAL:
# the notebooks are plain `# Databricks notebook source` .py files and import
# cleanly via Workspace -> Import. See README.md for the manual path.
#
# Usage (with the Databricks CLI v0.2+ configured for your Free Edition host):
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run flight_medallion -t dev
#
# The `catalog` job parameter is threaded into every notebook's `catalog` widget.

bundle:
  name: flight-medallion

variables:
  catalog:
    description: Unity Catalog name to build into.
    default: flight

targets:
  dev:
    mode: development
    default: true
    # Set this to your Free Edition workspace URL, or configure via
    # `databricks configure` / DATABRICKS_HOST + DATABRICKS_TOKEN env vars.
    # workspace:
    #   host: https://<your-workspace>.cloud.databricks.com

resources:
  jobs:
    flight_medallion:
      name: flight-medallion-build
      # Serverless compute is used when no job_clusters/new_cluster is given,
      # which is the simplest fit for Databricks Free Edition.
      tasks:
        - task_key: setup_unity_catalog
          notebook_task:
            notebook_path: ./notebooks/00_setup_unity_catalog.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: bronze_ingest
          depends_on:
            - task_key: setup_unity_catalog
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              source_mode: volume
        - task_key: silver_conform
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ./notebooks/02_silver_conform.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: gold_features
          depends_on:
            - task_key: silver_conform
          notebook_task:
            notebook_path: ./notebooks/03_gold_features.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: gold_marts
          depends_on:
            - task_key: silver_conform
          notebook_task:
            notebook_path: ./notebooks/04_gold_marts.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: lineage_and_governance
          depends_on:
            - task_key: gold_features
            - task_key: gold_marts
          notebook_task:
            notebook_path: ./notebooks/05_lineage_and_governance.py
            base_parameters:
              catalog: ${var.catalog}
